name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Python lint, types & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civicsense
          POSTGRES_PASSWORD: civicsense_dev
          POSTGRES_DB: civicsense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy .

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://civicsense:civicsense_dev@localhost:5432/civicsense_test
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://civicsense:civicsense_dev@localhost:5432/civicsense_test
          ENVIRONMENT: test
        run: pytest -v --tb=short

  # ────────────────────────────────────────────────────────────────
  dashboard:
    name: Dashboard — TypeScript, lint & tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test -- --run

      - name: Build
        env:
          VITE_DATA_MODE: mock
        run: npm run build

  # ────────────────────────────────────────────────────────────────
  android:
    name: Android — Unit tests & debug build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "MAPS_API_KEY=PLACEHOLDER_CI" >> local.properties
          echo "API_BASE_URL=http://localhost:8000" >> local.properties

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CivicSense-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for common secret patterns..."
          # Fail if any real-looking Google Maps API key found in tracked files
          if git grep -rn 'AIzaSy[0-9A-Za-z_-]\{35\}' -- '*.ts' '*.tsx' '*.js' '*.py' '*.kt' '*.xml' '*.json' '*.yaml' '*.yml' '*.md' '*.properties' 2>/dev/null | grep -v '\.example'; then
            echo "❌ Potential Google Maps API key found in source!"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"
